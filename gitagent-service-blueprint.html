<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gitagent Service Blueprint</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--orange:#d29922;--red:#f85149;--purple:#bc8cff;--cyan:#39d2c0;--pink:#f778ba;--yellow:#e3b341}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

.hdr{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.hdr h1{font-size:15px;font-weight:600;white-space:nowrap}
.hdr h1 em{color:var(--accent);font-style:normal}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cg{display:flex;align-items:center;gap:5px}
.cg label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
select,button{font-family:inherit;font-size:12px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:4px 9px;cursor:pointer}
select:hover,button:hover{border-color:var(--accent)}
.pb{font-size:11px;padding:3px 8px;border-radius:4px}
.pb.on{background:var(--accent);color:#000;border-color:var(--accent)}

.main{flex:1;display:flex;overflow:hidden}

.side{width:270px;border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;flex-shrink:0;padding:12px}
.side h3{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
.side h3:first-child{margin-top:0}
.li{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;border-radius:4px;padding:4px 6px}
.li:hover{background:var(--surface2)}
.li.hl{background:rgba(88,166,255,.15)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sf{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:11px;cursor:pointer;transition:all .15s}
.sf:hover,.sf.on{border-color:var(--accent);background:rgba(88,166,255,.08)}
.sf .fn{font-family:'SF Mono','Fira Code',monospace;font-weight:600;color:var(--accent);font-size:11px}
.sf .fd{color:var(--dim);margin-top:2px}
.sf .ff{color:var(--text);margin-top:4px;font-family:monospace;font-size:10px;line-height:1.5;white-space:pre}

.bpc{flex:1;overflow:auto;position:relative}
.bp{position:relative}

.sl{position:absolute;left:0;right:0;border-bottom:1px solid var(--border)}
.ll{position:absolute;left:0;top:0;bottom:0;width:90px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:mixed;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border-right:1px solid var(--border);z-index:2}

.nd{position:absolute;border-radius:7px;padding:7px 11px;font-size:11px;cursor:pointer;transition:all .12s;z-index:3;text-align:center;min-width:85px;border:1px solid}
.nd:hover{transform:scale(1.06);z-index:10}
.nd.dim{opacity:.12}
.nd.hi{box-shadow:0 0 14px rgba(88,166,255,.5);transform:scale(1.06);z-index:10}
.nd .nt{font-weight:600;font-size:11px;white-space:nowrap}
.nd .ns{font-size:9px;opacity:.7;margin-top:2px}

.nd.user{background:rgba(88,166,255,.15);border-color:var(--accent);color:var(--accent)}
.nd.cli{background:rgba(214,153,34,.15);border-color:var(--orange);color:var(--orange)}
.nd.adapter{background:rgba(188,140,255,.15);border-color:var(--purple);color:var(--purple)}
.nd.runner{background:rgba(57,210,192,.15);border-color:var(--cyan);color:var(--cyan)}
.nd.util{background:rgba(227,179,65,.15);border-color:var(--yellow);color:var(--yellow)}
.nd.fs{background:rgba(63,185,80,.15);border-color:var(--green);color:var(--green)}
.nd.ext{background:rgba(248,81,73,.15);border-color:var(--red);color:var(--red)}
.nd.schema{background:rgba(247,120,186,.15);border-color:var(--pink);color:var(--pink)}

svg.arr{position:absolute;top:0;left:0;pointer-events:none;z-index:2}
.tt{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:12px;max-width:360px;z-index:100;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
.tt .t1{font-weight:600;color:var(--accent);margin-bottom:4px}
.tt .t2{color:var(--dim);line-height:1.5}
.tt code{font-family:monospace;color:var(--green);font-size:11px}

.pbar{border-top:1px solid var(--border);background:var(--surface);padding:10px 20px;flex-shrink:0;display:flex;align-items:center;gap:12px}
.ptxt{flex:1;font-family:'SF Mono',monospace;font-size:11px;color:var(--dim);line-height:1.5;max-height:60px;overflow-y:auto}
.cbtn{background:var(--accent);color:#000;border:none;border-radius:6px;padding:6px 14px;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.cbtn:hover{opacity:.9}
</style>
</head>
<body>

<div class="hdr">
  <h1><em>gitagent</em> Service Blueprint</h1>
  <div class="ctrls">
    <div class="cg"><label>Flow</label>
      <select id="wfSel">
        <option value="run">Run (git repo &rarr; agent)</option>
        <option value="export">Export (agent &rarr; format)</option>
        <option value="validate">Validate (agent &rarr; report)</option>
        <option value="init">Init (scaffold agent)</option>
        <option value="import">Import (framework &rarr; agent)</option>
        <option value="audit">Audit (compliance report)</option>
        <option value="overview">Full Architecture</option>
      </select>
    </div>
    <div class="cg"><label>Presets</label>
      <button class="pb" data-p="data-flow">Data Flow</button>
      <button class="pb" data-p="adapters">Adapters</button>
      <button class="pb" data-p="validation">Validation</button>
      <button class="pb" data-p="compliance">Compliance</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="side">
    <h3>Swim Lanes</h3>
    <div class="li" data-hl="user"><div class="dot" style="background:var(--accent)"></div>User / Shell</div>
    <div class="li" data-hl="cli"><div class="dot" style="background:var(--orange)"></div>CLI Commands</div>
    <div class="li" data-hl="util"><div class="dot" style="background:var(--yellow)"></div>Utils (loader, skills, git)</div>
    <div class="li" data-hl="adapter"><div class="dot" style="background:var(--purple)"></div>Adapters</div>
    <div class="li" data-hl="runner"><div class="dot" style="background:var(--cyan)"></div>Runners</div>
    <div class="li" data-hl="fs"><div class="dot" style="background:var(--green)"></div>File System</div>
    <div class="li" data-hl="ext"><div class="dot" style="background:var(--red)"></div>External Process</div>
    <div class="li" data-hl="schema"><div class="dot" style="background:var(--pink)"></div>Schema / Validation</div>

    <h3>Agent File System</h3>
    <div id="filePanel"></div>

    <h3>Adapters (12)</h3>
    <div id="adapterPanel"></div>
  </div>

  <div class="bpc" id="bpc">
    <div class="bp" id="bp">
      <div id="lanes"></div>
      <svg class="arr" id="svg"></svg>
    </div>
  </div>
</div>

<div class="pbar">
  <div class="ptxt" id="prompt">Select a flow to explore the gitagent service blueprint.</div>
  <button class="cbtn" id="copyBtn">Copy</button>
</div>

<div class="tt" id="tt"></div>

<script>

  {name:'agent.yaml',desc:'Manifest (required)',fields:'name, version, description,\nmodel, skills[], tools[],\nagents{}, compliance{},\ndelegation, runtime, a2a'},

function render(){
  var wf=WF[S.wf];
  var bp=document.getElementById('bp');
  var la=document.getElementById('lanes');
  var sv=document.getElementById('svg');

  bp.style.minWidth=wf.w+'px';
  bp.style.minHeight=wf.h+'px';
  la.textContent='';
  sv.textContent='';
  bp.querySelectorAll('.nd').forEach(function(n){n.remove()});

  wf.lanes.forEach(function(l){
    var d=document.createElement('div');
    d.className='sl';d.style.top=l.y+'px';d.style.height=l.h+'px';d.style.background=l.color;
    var lb=document.createElement('div');
    lb.className='ll';lb.textContent=l.name;lb.style.color=l.lc;
    d.appendChild(lb);la.appendChild(d);
  });

  var nm={};
  wf.nodes.forEach(function(n){
    var d=document.createElement('div');
    d.className='nd '+n.t;
    d.style.left=n.x+'px';d.style.top=n.y+'px';
    d.dataset.id=n.id;d.dataset.type=n.t;

    var ti=document.createElement('div');ti.className='nt';ti.textContent=n.title;d.appendChild(ti);
    if(n.sub){var su=document.createElement('div');su.className='ns';su.textContent=n.sub;d.appendChild(su);}

    if(S.hl&&n.t!==S.hl)d.classList.add('dim');
    if(S.sel===n.id)d.classList.add('hi');

    d.addEventListener('mouseenter',function(e){showTT(e,n)});
    d.addEventListener('mouseleave',hideTT);
    d.addEventListener('click',function(){S.sel=S.sel===n.id?null:n.id;render()});

    bp.appendChild(d);nm[n.id]=d;
  });

  sv.setAttribute('width',wf.w);sv.setAttribute('height',wf.h);
  var df=document.createElementNS('http://www.w3.org/2000/svg','defs');
  var mk=document.createElementNS('http://www.w3.org/2000/svg','marker');
  mk.setAttribute('id','ah');mk.setAttribute('markerWidth','8');mk.setAttribute('markerHeight','6');
  mk.setAttribute('refX','8');mk.setAttribute('refY','3');mk.setAttribute('orient','auto');
  var pa=document.createElementNS('http://www.w3.org/2000/svg','path');
  pa.setAttribute('d','M0,0 L8,3 L0,6');pa.setAttribute('fill','rgba(139,148,158,.6)');
  mk.appendChild(pa);df.appendChild(mk);sv.appendChild(df);

  wf.arrows.forEach(function(p){
    var fe=nm[p[0]],te=nm[p[1]];if(!fe||!te)return;
    var fx=fe.offsetLeft+fe.offsetWidth/2,fy=fe.offsetTop+fe.offsetHeight/2;
    var tx=te.offsetLeft+te.offsetWidth/2,ty=te.offsetTop+te.offsetHeight/2;
    var dx=tx-fx,dy=ty-fy,x1,y1,x2,y2;
    if(Math.abs(dx)>Math.abs(dy)){
      x1=dx>0?fe.offsetLeft+fe.offsetWidth:fe.offsetLeft;y1=fy;
      x2=dx>0?te.offsetLeft:te.offsetLeft+te.offsetWidth;y2=ty;
    }else{
      x1=fx;y1=dy>0?fe.offsetTop+fe.offsetHeight:fe.offsetTop;
      x2=tx;y2=dy>0?te.offsetTop:te.offsetTop+te.offsetHeight;
    }
    var dm=S.hl&&!fe.classList.contains(S.hl)&&!te.classList.contains(S.hl);
    var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);ln.setAttribute('x2',x2);ln.setAttribute('y2',y2);
    ln.setAttribute('stroke',dm?'rgba(139,148,158,.06)':'rgba(139,148,158,.3)');
    ln.setAttribute('stroke-width','1.5');ln.setAttribute('marker-end','url(#ah)');
    sv.appendChild(ln);
  });

  updPrompt();renderFiles();renderAdapters();updPresets();
}

function renderFiles(){
  var p=document.getElementById('filePanel');p.textContent='';
  AGENT_FILES.forEach(function(f){
    var d=document.createElement('div');d.className='sf'+(S.selFile===f.name?' on':'');
    var n=document.createElement('div');n.className='fn';n.textContent=f.name;d.appendChild(n);
    var ds=document.createElement('div');ds.className='fd';ds.textContent=f.desc;d.appendChild(ds);
    var ff=document.createElement('div');ff.className='ff';ff.textContent=f.fields;d.appendChild(ff);
    d.addEventListener('click',function(){S.selFile=S.selFile===f.name?null:f.name;render()});
    p.appendChild(d);
  });
}

function renderAdapters(){
  var p=document.getElementById('adapterPanel');p.textContent='';

    var d=document.createElement('div');d.className='sf';
    var n=document.createElement('div');n.className='fn';n.textContent=a.name;d.appendChild(n);
    var ds=document.createElement('div');ds.className='fd';ds.textContent=a.desc;d.appendChild(ds);
    p.appendChild(d);

}

function showTT(e,n){
  var t=document.getElementById('tt');t.textContent='';
  var h=document.createElement('div');h.className='t1';h.textContent=n.title;t.appendChild(h);
  var b=document.createElement('div');b.className='t2';b.textContent=n.tip||n.sub||'';t.appendChild(b);
  t.style.display='block';
  var r=t.getBoundingClientRect();
  t.style.left=Math.min(e.clientX+12,window.innerWidth-r.width-20)+'px';
  t.style.top=Math.min(e.clientY+12,window.innerHeight-r.height-20)+'px';
}
function hideTT(){document.getElementById('tt').style.display='none'}

function updPrompt(){
  var wf=WF[S.wf];
  var parts=['gitagent "'+wf.title+'"'];
  if(S.hl)parts.push('highlighting '+S.hl+' layer');
  if(S.sel){var n=wf.nodes.find(function(x){return x.id===S.sel});if(n)parts.push('- "'+n.title+'": '+(n.tip||n.sub));}
  if(S.selFile){var f=AGENT_FILES.find(function(x){return x.name===S.selFile});if(f)parts.push('\n\n'+f.name+': '+f.desc+'. Fields: '+f.fields.replace(/\n/g,', '));}
  document.getElementById('prompt').textContent=parts.join(' ');
}

var PRESETS={
  'data-flow':{wf:'run',hl:null},
  'adapters':{wf:'export',hl:'adapter'},
  'validation':{wf:'validate',hl:'schema'},
  'compliance':{wf:'audit',hl:null},
};

function updPresets(){
  document.querySelectorAll('.pb').forEach(function(b){
    var p=PRESETS[b.dataset.p];
    b.classList.toggle('on',p&&S.wf===p.wf&&S.hl===p.hl);
  });
}

document.getElementById('wfSel').addEventListener('change',function(e){S.wf=e.target.value;S.sel=null;S.hl=null;render()});
document.querySelectorAll('.pb').forEach(function(b){b.addEventListener('click',function(){var p=PRESETS[b.dataset.p];if(p){S.wf=p.wf;S.hl=p.hl;S.sel=null;document.getElementById('wfSel').value=p.wf;render()}})});
document.querySelectorAll('.li').forEach(function(i){i.addEventListener('click',function(){var h=i.dataset.hl;S.hl=S.hl===h?null:h;document.querySelectorAll('.li').forEach(function(x){x.classList.toggle('hl',x.dataset.hl===S.hl)});render()})});
document.getElementById('copyBtn').addEventListener('click',function(){var t=document.getElementById('prompt').textContent;navigator.clipboard.writeText(t).then(function(){var b=document.getElementById('copyBtn');b.textContent='Copied!';setTimeout(function(){b.textContent='Copy'},1500)})});

render();
</script>
</body>
</html>
