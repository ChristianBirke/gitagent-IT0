layers:
  - name: working
    path: MEMORY.md
    max_lines: 200
    format: markdown
  - name: archive
    path: archive/
    format: yaml
    rotation: monthly
update_triggers:
  - on_session_end
  - on_explicit_save
  - after_skill: coaching-session
  - after_skill: accountability-check
  - after_skill: strategy-builder
archive_policy:
  max_entries: 500
  compress_after: 90d
  retention_period: 1y
