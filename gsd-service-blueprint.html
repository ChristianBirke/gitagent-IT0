<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSD Service Blueprint — gitagent</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --cyan: #39d2c0;
    --pink: #f778ba;
    --lane-user: #1a2740;
    --lane-orch: #1a1f2e;
    --lane-agent: #1f1a2e;
    --lane-fs: #1a2e1f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .header h1 span { color: var(--accent); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .control-group { display: flex; align-items: center; gap: 6px; }
  .control-group label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  select, button { font-family: inherit; font-size: 12px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  select:hover, button:hover { border-color: var(--accent); }
  .preset-btn { font-size: 11px; padding: 4px 8px; border-radius: 4px; }
  .preset-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .main { flex: 1; display: flex; overflow: hidden; }

  .sidebar { width: 260px; border-right: 1px solid var(--border); background: var(--surface); overflow-y: auto; flex-shrink: 0; padding: 12px; }
  .sidebar h3 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 12px 0 6px; }
  .sidebar h3:first-child { margin-top: 0; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; border-radius: 4px; padding: 4px 6px; }
  .legend-item:hover { background: var(--surface2); }
  .legend-item.highlighted { background: rgba(88,166,255,0.15); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .state-file { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
  .state-file:hover, .state-file.active { border-color: var(--accent); background: rgba(88,166,255,0.08); }
  .state-file .fname { font-family: 'SF Mono', 'Fira Code', monospace; font-weight: 600; color: var(--accent); font-size: 11px; }
  .state-file .fdesc { color: var(--text-dim); margin-top: 2px; }
  .state-file .ffields { color: var(--text); margin-top: 4px; font-family: monospace; font-size: 10px; line-height: 1.5; white-space: pre; }

  .route-item { padding: 6px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 4px; cursor: pointer; border-left: 3px solid transparent; }
  .route-item:hover, .route-item.active { background: var(--surface2); border-left-color: var(--accent); }
  .route-item .route-num { color: var(--accent); font-weight: 700; }
  .route-item .route-cond { color: var(--text-dim); font-size: 10px; display: block; margin-top: 2px; }

  .blueprint-container { flex: 1; overflow: auto; position: relative; }
  .blueprint { position: relative; }

  .swim-lane { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--border); }
  .lane-label { position: absolute; left: 0; top: 0; bottom: 0; width: 100px; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: mixed; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border-right: 1px solid var(--border); z-index: 2; }

  .node { position: absolute; border-radius: 8px; padding: 8px 12px; font-size: 11px; cursor: pointer; transition: all 0.15s; z-index: 3; text-align: center; min-width: 90px; border: 1px solid; }
  .node:hover { transform: scale(1.05); z-index: 10; }
  .node.dimmed { opacity: 0.15; }
  .node.highlighted { box-shadow: 0 0 12px rgba(88,166,255,0.5); transform: scale(1.05); z-index: 10; }
  .node .node-title { font-weight: 600; font-size: 11px; white-space: nowrap; }
  .node .node-sub { font-size: 9px; opacity: 0.7; margin-top: 2px; }

  .node.user-action { background: rgba(88,166,255,0.15); border-color: var(--accent); color: var(--accent); }
  .node.orchestrator { background: rgba(214,153,34,0.15); border-color: var(--orange); color: var(--orange); }
  .node.subagent { background: rgba(188,140,255,0.15); border-color: var(--purple); color: var(--purple); }
  .node.file-write { background: rgba(63,185,80,0.15); border-color: var(--green); color: var(--green); }
  .node.gate { background: rgba(248,81,73,0.15); border-color: var(--red); color: var(--red); border-style: dashed; }
  .node.decision { background: rgba(57,210,192,0.15); border-color: var(--cyan); color: var(--cyan); border-radius: 4px; }
  .node.commit { background: rgba(247,120,186,0.15); border-color: var(--pink); color: var(--pink); border-radius: 50%; min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; padding: 4px; }

  svg.arrows { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; }

  .tooltip { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 12px; max-width: 320px; z-index: 100; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none; }
  .tooltip .tt-title { font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .tooltip .tt-body { color: var(--text-dim); line-height: 1.5; }

  .prompt-bar { border-top: 1px solid var(--border); background: var(--surface); padding: 10px 20px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
  .prompt-text { flex: 1; font-family: 'SF Mono', monospace; font-size: 11px; color: var(--text-dim); line-height: 1.5; max-height: 60px; overflow-y: auto; }
  .copy-btn { background: var(--accent); color: #000; border: none; border-radius: 6px; padding: 6px 14px; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .copy-btn:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="header">
  <h1><span>GSD</span> Service Blueprint</h1>
  <div class="controls">
    <div class="control-group">
      <label>Workflow</label>
      <select id="workflowSelect">
        <option value="new-project">New Project Init</option>
        <option value="phase-lifecycle">Phase Lifecycle</option>
        <option value="routing">Next Routing Logic</option>
        <option value="agents">Agent Spawning</option>
        <option value="state">State Management</option>
      </select>
    </div>
    <div class="control-group">
      <label>Detail</label>
      <select id="detailLevel">
        <option value="full">Full</option>
        <option value="compact">Compact</option>
      </select>
    </div>
    <div class="control-group">
      <label>Presets</label>
      <button class="preset-btn" data-preset="overview">Overview</button>
      <button class="preset-btn" data-preset="research">Research Flow</button>
      <button class="preset-btn" data-preset="execution">Execution</button>
      <button class="preset-btn" data-preset="safety">Safety Gates</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <h3>Swim Lanes</h3>
    <div class="legend-item" data-highlight="user-action"><div class="legend-dot" style="background:var(--accent)"></div>User Action</div>
    <div class="legend-item" data-highlight="orchestrator"><div class="legend-dot" style="background:var(--orange)"></div>Orchestrator</div>
    <div class="legend-item" data-highlight="subagent"><div class="legend-dot" style="background:var(--purple)"></div>Subagent</div>
    <div class="legend-item" data-highlight="file-write"><div class="legend-dot" style="background:var(--green)"></div>File System</div>
    <h3>Node Types</h3>
    <div class="legend-item" data-highlight="gate"><div class="legend-dot" style="background:var(--red);border-radius:2px"></div>Safety Gate</div>
    <div class="legend-item" data-highlight="decision"><div class="legend-dot" style="background:var(--cyan);border-radius:2px"></div>Decision Point</div>
    <div class="legend-item" data-highlight="commit"><div class="legend-dot" style="background:var(--pink)"></div>Git Commit</div>
    <h3>State Files</h3>
    <div id="statePanel"></div>
    <h3>/gsd-next Routes</h3>
    <div id="routeList"></div>
  </div>

  <div class="blueprint-container" id="blueprintContainer">
    <div class="blueprint" id="blueprint">
      <div id="swimLanes"></div>
      <svg class="arrows" id="arrows"></svg>
    </div>
  </div>
</div>

<div class="prompt-bar">
  <div class="prompt-text" id="promptOutput">Select a workflow to explore the GSD service blueprint.</div>
  <button class="copy-btn" id="copyBtn">Copy</button>
</div>

<div class="tooltip" id="tooltip"></div>

// ─── RENDER ──────────────────────────────────────────────

function render() {
  const wf = WORKFLOWS[state.workflow];
  const bp = document.getElementById('blueprint');
  const lanesEl = document.getElementById('swimLanes');
  const svg = document.getElementById('arrows');

  bp.style.minWidth = wf.width + 'px';
  bp.style.minHeight = wf.height + 'px';

  // Clear old nodes
  lanesEl.textContent = '';
  svg.textContent = '';
  bp.querySelectorAll('.node').forEach(function(n) { n.remove(); });

  // Draw lanes
  wf.lanes.forEach(function(lane) {
    var div = document.createElement('div');
    div.className = 'swim-lane';
    div.style.top = lane.y + 'px';
    div.style.height = lane.h + 'px';
    div.style.background = lane.color;
    var label = document.createElement('div');
    label.className = 'lane-label';
    label.textContent = lane.name;
    var colors = { USER: 'var(--accent)', ORCHESTRATOR: 'var(--orange)', SUBAGENTS: 'var(--purple)', 'FILE SYSTEM': 'var(--green)' };
    label.style.color = colors[lane.name] || 'var(--text)';
    div.appendChild(label);
    lanesEl.appendChild(div);
  });

  // Draw nodes
  var nodeMap = {};
  wf.nodes.forEach(function(n) {
    var div = document.createElement('div');
    div.className = 'node ' + n.type;
    div.style.left = n.x + 'px';
    div.style.top = n.y + 'px';
    div.dataset.id = n.id;
    div.dataset.type = n.type;

    var titleEl = document.createElement('div');
    titleEl.className = 'node-title';
    titleEl.textContent = n.title;
    div.appendChild(titleEl);

    if (n.sub) {
      var subEl = document.createElement('div');
      subEl.className = 'node-sub';
      subEl.textContent = n.sub;
      div.appendChild(subEl);
    }

    if (state.highlight && n.type !== state.highlight) {
      div.classList.add('dimmed');
    }
    if (state.selectedNode === n.id) {
      div.classList.add('highlighted');
    }

    div.addEventListener('mouseenter', function(e) { showTooltip(e, n); });
    div.addEventListener('mouseleave', hideTooltip);
    div.addEventListener('click', function() {
      state.selectedNode = state.selectedNode === n.id ? null : n.id;
      render();
    });

    bp.appendChild(div);
    nodeMap[n.id] = div;
  });

  // SVG setup
  svg.setAttribute('width', wf.width);
  svg.setAttribute('height', wf.height);

  var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  var marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  marker.setAttribute('id', 'arrowhead');
  marker.setAttribute('markerWidth', '8');
  marker.setAttribute('markerHeight', '6');
  marker.setAttribute('refX', '8');
  marker.setAttribute('refY', '3');
  marker.setAttribute('orient', 'auto');
  var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'M0,0 L8,3 L0,6');
  path.setAttribute('fill', 'rgba(139,148,158,0.6)');
  marker.appendChild(path);
  defs.appendChild(marker);
  svg.appendChild(defs);

  // Draw arrows
  wf.arrows.forEach(function(pair) {
    var fromEl = nodeMap[pair[0]];
    var toEl = nodeMap[pair[1]];
    if (!fromEl || !toEl) return;

    var fx = fromEl.offsetLeft + fromEl.offsetWidth / 2;
    var fy = fromEl.offsetTop + fromEl.offsetHeight / 2;
    var tx = toEl.offsetLeft + toEl.offsetWidth / 2;
    var ty = toEl.offsetTop + toEl.offsetHeight / 2;

    var dx = tx - fx;
    var dy = ty - fy;
    var x1, y1, x2, y2;

    if (Math.abs(dx) > Math.abs(dy)) {
      x1 = dx > 0 ? fromEl.offsetLeft + fromEl.offsetWidth : fromEl.offsetLeft;
      y1 = fy;
      x2 = dx > 0 ? toEl.offsetLeft : toEl.offsetLeft + toEl.offsetWidth;
      y2 = ty;
    } else {
      x1 = fx;
      y1 = dy > 0 ? fromEl.offsetTop + fromEl.offsetHeight : fromEl.offsetTop;
      x2 = tx;
      y2 = dy > 0 ? toEl.offsetTop : toEl.offsetTop + toEl.offsetHeight;
    }

    var dimmed = state.highlight && !fromEl.classList.contains(state.highlight) && !toEl.classList.contains(state.highlight);

    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', dimmed ? 'rgba(139,148,158,0.08)' : 'rgba(139,148,158,0.35)');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('marker-end', 'url(#arrowhead)');
    svg.appendChild(line);
  });

  updatePrompt();
  renderStatePanel();
  renderRouteList();
  updatePresetButtons();
}

function renderStatePanel() {
  var panel = document.getElementById('statePanel');
  panel.textContent = '';
  STATE_FILES.forEach(function(f) {
    var div = document.createElement('div');
    div.className = 'state-file' + (state.selectedFile === f.name ? ' active' : '');

    var nameEl = document.createElement('div');
    nameEl.className = 'fname';
    nameEl.textContent = f.name;
    div.appendChild(nameEl);

    var descEl = document.createElement('div');
    descEl.className = 'fdesc';
    descEl.textContent = f.desc;
    div.appendChild(descEl);

    var fieldsEl = document.createElement('div');
    fieldsEl.className = 'ffields';
    fieldsEl.textContent = f.fields;
    div.appendChild(fieldsEl);

    div.addEventListener('click', function() {
      state.selectedFile = state.selectedFile === f.name ? null : f.name;
      render();
    });
    panel.appendChild(div);
  });
}

function renderRouteList() {
  var list = document.getElementById('routeList');
  list.textContent = '';
  ROUTES.forEach(function(r) {
    var div = document.createElement('div');
    div.className = 'route-item' + (state.selectedRoute === r.num ? ' active' : '');

    var numSpan = document.createElement('span');
    numSpan.className = 'route-num';
    numSpan.textContent = 'R' + r.num;
    div.appendChild(numSpan);
    div.appendChild(document.createTextNode(' ' + r.name));

    var condSpan = document.createElement('span');
    condSpan.className = 'route-cond';
    condSpan.textContent = r.condition;
    div.appendChild(condSpan);

    div.addEventListener('click', function() {
      state.selectedRoute = state.selectedRoute === r.num ? null : r.num;
      render();
    });
    list.appendChild(div);
  });
}

// ─── TOOLTIP ─────────────────────────────────────────────

function showTooltip(e, node) {
  var tt = document.getElementById('tooltip');
  tt.textContent = '';

  var titleEl = document.createElement('div');
  titleEl.className = 'tt-title';
  titleEl.textContent = node.title;
  tt.appendChild(titleEl);

  var bodyEl = document.createElement('div');
  bodyEl.className = 'tt-body';
  bodyEl.textContent = node.tip;
  tt.appendChild(bodyEl);

  tt.style.display = 'block';
  var rect = tt.getBoundingClientRect();
  tt.style.left = Math.min(e.clientX + 12, window.innerWidth - rect.width - 20) + 'px';
  tt.style.top = Math.min(e.clientY + 12, window.innerHeight - rect.height - 20) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ─── PROMPT OUTPUT ───────────────────────────────────────

function updatePrompt() {
  var wf = WORKFLOWS[state.workflow];
  var parts = ['The GSD "' + wf.title + '" workflow'];

  if (state.workflow !== DEFAULTS.workflow) {
    parts.push('(' + wf.desc + ')');
  }

  if (state.highlight) {
    parts.push('highlighting ' + state.highlight.replace('-', ' ') + ' nodes');
  }

  if (state.selectedNode) {
    var node = wf.nodes.find(function(n) { return n.id === state.selectedNode; });
    if (node) parts.push('- focused on "' + node.title + '": ' + node.tip);
  }

  if (state.selectedFile) {
    var f = STATE_FILES.find(function(sf) { return sf.name === state.selectedFile; });
    if (f) parts.push('\n\nState file ' + f.name + ': ' + f.desc + '. Fields: ' + f.fields.replace(/\n/g, ', ') + '. Written by: ' + f.writes.join(', ') + '. Read by: ' + f.reads.join(', ') + '.');
  }

  if (state.selectedRoute !== null) {
    var r = ROUTES.find(function(rt) { return rt.num === state.selectedRoute; });
    if (r) parts.push('\n\nRoute ' + r.num + ' (' + r.name + '): When ' + r.condition + ' \u2192 ' + r.action);
  }

  document.getElementById('promptOutput').textContent = parts.join(' ');
}

// ─── PRESETS ─────────────────────────────────────────────

var PRESETS = {
  overview: { workflow: 'new-project', detail: 'full', highlight: null },
  research: { workflow: 'agents', detail: 'full', highlight: 'subagent' },
  execution: { workflow: 'phase-lifecycle', detail: 'full', highlight: null },
  safety: { workflow: 'routing', detail: 'full', highlight: 'gate' },
};

function applyPreset(name) {
  var p = PRESETS[name];
  if (!p) return;
  state.workflow = p.workflow;
  state.detail = p.detail;
  state.highlight = p.highlight;
  state.selectedNode = null;
  state.selectedFile = null;
  state.selectedRoute = null;
  document.getElementById('workflowSelect').value = p.workflow;
  document.getElementById('detailLevel').value = p.detail;
  render();
}

function updatePresetButtons() {
  document.querySelectorAll('.preset-btn').forEach(function(btn) {
    var p = PRESETS[btn.dataset.preset];
    btn.classList.toggle('active', p && state.workflow === p.workflow && state.highlight === p.highlight);
  });
}

// ─── EVENT LISTENERS ─────────────────────────────────────

document.getElementById('workflowSelect').addEventListener('change', function(e) {
  state.workflow = e.target.value;
  state.selectedNode = null;
  state.highlight = null;
  render();
});

document.getElementById('detailLevel').addEventListener('change', function(e) {
  state.detail = e.target.value;
  render();
});

document.querySelectorAll('.preset-btn').forEach(function(btn) {
  btn.addEventListener('click', function() { applyPreset(btn.dataset.preset); });
});

document.querySelectorAll('.legend-item').forEach(function(item) {
  item.addEventListener('click', function() {
    var hl = item.dataset.highlight;
    state.highlight = state.highlight === hl ? null : hl;
    document.querySelectorAll('.legend-item').forEach(function(i) {
      i.classList.toggle('highlighted', i.dataset.highlight === state.highlight);
    });
    render();
  });
});

document.getElementById('copyBtn').addEventListener('click', function() {
  var text = document.getElementById('promptOutput').textContent;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
  });
});

// ─── INIT ────────────────────────────────────────────────
render();
</script>
</body>
</html>
